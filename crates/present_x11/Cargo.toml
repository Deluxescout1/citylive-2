[package]
name = "present_x11"
description = "CityLive Iso X11 desktop presentation backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "citylive-iso-x11"
path = "src/main.rs"

[dependencies]
endfx = { path = "../endfx" }
buildkit = { path = "../buildkit" }
render = { path = "../render" }
map = { path = "../map" }
sim = { path = "../sim" }
x11rb = { version = "0.13.2", default-features = false, features = ["allow-unsafe-code", "randr", "shm", "shape", "xfixes"] }
libc = "0.2"
log = "0.4"
bytemuck = "1.25"
