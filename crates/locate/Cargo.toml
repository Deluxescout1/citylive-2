[package]
name = "locate"
description = "CityLive Iso location services (B96): OS location, no-key IP lookup, cache, default, and place search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
world = { path = "../world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Devices_Geolocation", "Foundation"] }

[features]
# The real HTTPS client (pure-Rust rustls) for IP lookup and place search.
net = ["world/net"]
